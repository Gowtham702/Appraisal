spring.application.name=employee-appraisal

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/employee_appraisal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

spring.datasource.username=root

spring.datasource.password=root123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=20MB

spring.servlet.multipart.max-request-size=21MB

app.upload-dir=uploads

# Admin login
app.admin.username=admin
app.admin.password=Admin@123

# Session cookie configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m