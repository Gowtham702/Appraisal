<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <title>Appraisal Completed</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        ::selection {
            background: #b9f2df;
            color: #000;
        }

        /* TOP LOGO */
        .top-logo {
            width: 130px;
            display: block;
            margin-left: auto;
            margin-bottom: 20px;
        }

        .top-logo img {
            width: 130px;
        }


        /* FORM BOX */
        .form-container {
            width: 650px;
            margin: 70px auto;
            background: #e8f8f5;
            padding: 45px 35px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }


        h2 {
            font-size: 28px;
            color: #22b573;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #333;
        }

        .checkmark {
            font-size: 50px;
            margin-bottom: 15px;
        }


        /* BOTTOM LOGO */
        .bottom-logo {
            text-align: center;
            margin-top: 30px;
            padding-bottom: 10px;
        }

        .bottom-logo img {
            width: 110px;
        }

    </style>
</head>


<body>



<div class="form-container">


    <div class="top-logo">
        <img src="images/agent42_Labs_Logo.png" alt="Logo">
    </div>

    <div class="checkmark">🎉</div>

    <h2>Appraisal Completed Successfully!</h2>

    <p>[ You've launched your GROW Journey ]</p>

    <p>
    Every achievement starts with a goal, and you've successfully completed the first step.
    </p>

    <p>
    Let's continue by exploring the results and impact you've created along the way. 🚀
    </p>

    <div class="bottom-logo">
        <img src="images/agent42_Labs_Logo.png" alt="Logo">
    </div>

</div>

</body>
</html>
